# version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000
      - VITE_FIREBASE_AUTH_DOMAIN=localhost
      - VITE_USE_EMULATOR=true
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend
    networks:
      - turfhub

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=development
      - FIRESTORE_EMULATOR_HOST=firebase-emulator:8080
      - FIREBASE_AUTH_EMULATOR_HOST=firebase-emulator:9099
    volumes:
      - ./backend/src:/app/src
    depends_on:
      - firebase-emulator
    networks:
      - turfhub

  firebase-emulator:
    image: node:20-alpine
    working_dir: /app
    command: >
      sh -c "npm install -g firebase-tools &&
             firebase emulators:start
             --only firestore,auth,storage
             --project turf-database"
    ports:
      - "4000:4000"   # Emulator UI
      - "8080:8080"   # Firestore
      - "9099:9099"   # Auth
      - "9199:9199"   # Storage
    volumes:
      - ./firebase.json:/app/firebase.json
      - ./firestore.rules:/app/firestore.rules
      - ./.firebaserc:/app/.firebaserc
      - firebase-data:/root/.cache
    networks:
      - turfhub

networks:
  turfhub:
    driver: bridge

volumes:
  firebase-data:
